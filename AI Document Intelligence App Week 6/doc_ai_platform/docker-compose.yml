services:
  ui:
    build: .
    ports: ["8501:8501"]
    environment:
      - APP_DATA_DIR=/data
    env_file: [".env"]        # copy .env.example to .env first
    volumes: ["docdata:/data"]
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment:
      - APP_DATA_DIR=/data
    env_file: [".env"]
    volumes: ["docdata:/data"] # same volume = same documents as the UI
volumes:
  docdata:
